<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Certificates</title>
<meta name="description" content="Course certificates with links to each provider's official verification page.">
<meta property="og:type" content="website">
<meta property="og:title" content="Course Certificates · Clark Faint">
<meta property="og:description" content="Completed coursework, each linked to the provider's verification page.">
<meta property="og:url" content="https://clarkfaint.github.io/credentials/">
<meta property="og:image" content="https://clarkfaint.github.io/credentials/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6470;
    --line: #e2e5ea; --accent: #1f5fbf; --accent-text: #ffffff; --tag: #eef2f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171b21; --text: #e7eaee; --muted: #9aa3ae;
      --line: #262c35; --accent: #5b9bff; --accent-text: #0f1216; --tag: #1f2630;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 1.9rem; letter-spacing: -0.01em; }
  header .who { color: var(--muted); margin: 0; }
  header .links { margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap; }
  header .links a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .note { color: var(--muted); font-size: 0.92rem; margin: 20px 0 28px;
          padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--card); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .card h2 { font-size: 1.08rem; margin: 0; }
  .meta { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .tag { background: var(--tag); border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; }
  .verify { margin-top: auto; align-self: flex-start; background: var(--accent); color: var(--accent-text);
            text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 7px 14px; border-radius: 7px; }
  .verify:hover { opacity: 0.9; }
  .thumb { display: block; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .thumb img { display: block; width: 100%; height: auto; }
  .actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .empty, .error { color: var(--muted); }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Course Certificates</h1>
    <p class="who" id="who"></p>
    <div class="links" id="links"></div>
  </header>

  <p class="note">Continuing-education courses completed outside the Credly network.
  Click a certificate to open the PDF, or use <strong>Verify</strong> to confirm it on the provider's site.</p>

  <main class="grid" id="grid"><p class="empty">Loading…</p></main>

  <footer>Newest first · Updated from <code>credentials.json</code></footer>
</div>

<script>
  function fmtDate(ym) {
    const [y, m, d] = String(ym).split("-");
    if (!m) return y;
    const opts = d ? { month: "short", day: "numeric", year: "numeric" } : { month: "short", year: "numeric" };
    return new Date(+y, +m - 1, +(d || 1)).toLocaleString("en-US", opts);
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }
  fetch("credentials.json", { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      const o = data.owner || {};
      document.getElementById("who").textContent = [o.name, o.headline].filter(Boolean).join(" · ");
      const links = document.getElementById("links");
      if (o.linkedin) { const a = el("a", null, "LinkedIn"); a.href = o.linkedin; links.append(a); }
      if (o.github) { const a = el("a", null, "GitHub"); a.href = o.github; links.append(a); }

      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      const items = (data.credentials || []).slice().sort((a, b) => String(b.completed).localeCompare(String(a.completed)));
      if (!items.length) { grid.append(el("p", "empty", "No credentials listed yet.")); return; }

      for (const c of items) {
        const card = el("article", "card");
        if (c.certificate_image) {
          const t = el("a", "thumb");
          t.href = c.certificate_pdf || c.certificate_image; t.target = "_blank"; t.rel = "noopener";
          const img = el("img");
          img.src = c.certificate_image; img.alt = `Certificate: ${c.title}`; img.loading = "lazy";
          t.append(img); card.append(t);
        }
        card.append(el("h2", null, c.title));
        card.append(el("p", "meta", `${c.provider} · Completed ${fmtDate(c.completed)}`));
        if (c.skills && c.skills.length) {
          const tags = el("div", "tags");
          c.skills.forEach(s => tags.append(el("span", "tag", s)));
          card.append(tags);
        }
        const actions = el("div", "actions");
        const btn = (cls, label, href) => {
          const a = el("a", cls, label);
          a.href = href; a.target = "_blank"; a.rel = "noopener";
          actions.append(a);
        };
        if (c.share_url) btn("verify", "View certificate ↗", c.share_url);
        if (c.verify_url) btn("verify secondary", "Verify ↗", c.verify_url);
        if (actions.children.length) card.append(actions);
        grid.append(card);
      }
    })
    .catch(() => {
      document.getElementById("grid").innerHTML =
        '<p class="error">Couldn\'t load credentials.json.</p>';
    });
</script>
</body>
</html>
